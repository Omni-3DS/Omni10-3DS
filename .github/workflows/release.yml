name: Release Omni10

on:
  push:
    branches: [main, master]
    paths:
      - 'version.dat'
      - 'firm/**'
      - 'Makefile'
      - 'installer/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITARM: /opt/devkitpro/devkitARM
      PATH: /opt/devkitpro/devkitARM/bin:/opt/devkitpro/tools/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

    steps:
      - uses: actions/checkout@v4

      - name: Read version.dat
        id: ver
        run: |
          V=$(tr -d ' \t\r\n' < version.dat)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Omni10 version: $V"

      - name: Install tools
        run: |
          apt-get update
          apt-get install -y python3-pip curl zip
          python3 -m pip install --break-system-packages git+https://github.com/TuxSH/firmtool.git

      - name: Build Omni10.firm
        run: make firm

      - name: Build O10-Inst-Booter (3dsx)
        run: |
          if [ -f installer/Makefile ]; then
            make -C installer all || echo "Installer build optional if libs missing"
          fi

      - name: Package
        run: |
          V="${{ steps.ver.outputs.version }}"
          mkdir -p dist
          cp -f Omni10.firm "dist/Omni10-v${V}.firm" 2>/dev/null || true
          cp -f Omni10.firm dist/Omni10.firm 2>/dev/null || true
          echo "$V" > dist/version.dat
          if [ -f installer/O10-Inst-Booter.3dsx ]; then
            cp installer/O10-Inst-Booter.3dsx "dist/O10-Inst-Booter-v${V}.3dsx"
          fi
          if [ -f installer/O10-Inst-Booter.cia ]; then
            cp installer/O10-Inst-Booter.cia "dist/O10-Inst-Booter-v${V}.cia"
          fi
          (cd dist && zip -r "../Omni10-v${V}.zip" .) || true
          ls -la dist || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Omni10-v${{ steps.ver.outputs.version }}
          path: |
            dist/**

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Omni10 v${{ steps.ver.outputs.version }}
          body: |
            ## Omni10-3DS v${{ steps.ver.outputs.version }}

            ### Files
            - `Omni10.firm` / `Omni10-v*.firm` → `sdmc:/luma/payloads/Omni10.firm`
            - `O10-Inst-Booter` (3dsx/cia if built) → Installer / Updater / Booter

            ### Boot (O10-Inst-Booter)
            1. Open **O10-Inst-Booter**
            2. **Boot Omni10** → hold **START**
            3. Reboot into **Luma chainloader** → select **Omni10**

            `version.dat`: `${{ steps.ver.outputs.version }}`
          files: |
            dist/**
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
