name: Release Omni10

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['version.dat']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITARM: /opt/devkitpro/devkitARM
      PATH: /opt/devkitpro/devkitARM/bin:/opt/devkitpro/tools/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: ver
        run: |
          V=$(tr -d ' \t\r\n' < version.dat)
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Tools
        run: |
          apt-get update
          apt-get install -y python3-pip curl zip
          python3 -m pip install --break-system-packages git+https://github.com/TuxSH/firmtool.git

      - name: Build firm
        run: make firm

      - name: Assets + installer 3dsx
        run: |
          python3 scripts/gen_assets.py
          make -C installer all

      - name: Package dist (normal filenames)
        run: |
          V="${{ steps.ver.outputs.version }}"
          mkdir -p dist
          cp -f Omni10.firm dist/Omni10.firm
          cp -f version.dat dist/version.dat
          cp -f installer/O10-Inst-Booter.3dsx dist/O10-Inst-Booter.3dsx
          if command -v bannertool >/dev/null 2>&1 && command -v makerom >/dev/null 2>&1; then
            make -f installer/Makefile.cia cia || true
            cp -f installer/O10-Inst-Booter.cia dist/O10-Inst-Booter.cia || true
          fi
          (cd dist && zip -r "../Omni10-${V}.zip" .)
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: Omni10-${{ steps.ver.outputs.version }}
          path: dist/**

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Omni10 v${{ steps.ver.outputs.version }}
          body: |
            **Omni10 v${{ steps.ver.outputs.version }}**

            | File | Path on SD |
            |------|------------|
            | `Omni10.firm` | `sdmc:/luma/payloads/Omni10.firm` |
            | `O10-Inst-Booter.3dsx` | Homebrew Launcher |
            | `O10-Inst-Booter.cia` | FBI / Universal-Updater (if present) |
          files: |
            dist/Omni10.firm
            dist/O10-Inst-Booter.3dsx
            dist/O10-Inst-Booter.cia
            dist/version.dat
            Omni10-${{ steps.ver.outputs.version }}.zip
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
