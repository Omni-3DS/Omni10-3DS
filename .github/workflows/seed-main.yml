name: seed-firm-main
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/firm_main_*.zlib.b64'
      - 'scripts/decode_firm_main.py'
      - '.github/workflows/seed-main.yml'
jobs:
  seed:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode full main.c
        run: python3 scripts/decode_firm_main.py
      - name: Commit main.c if changed
        run: |
          git config user.name "Omni10 Bot"
          git config user.email "bot@omni10.local"
          git add firm/arm9/main.c
          git diff --staged --quiet || git commit -m "FIRM: materialize full main.c (all features)"
          git push || true
