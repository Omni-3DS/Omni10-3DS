name: Build Omni10 FIRM

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITARM: /opt/devkitpro/devkitARM
      PATH: /opt/devkitpro/devkitARM/bin:/opt/devkitpro/tools/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pip and firmtool
        run: |
          apt-get update
          apt-get install -y python3-pip
          python3 -m pip install --break-system-packages git+https://github.com/TuxSH/firmtool.git

      - name: Build Omni10.firm
        run: make firm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Omni10-firm
          path: Omni10.firm
