name: Build Omni10-3DS

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  release:
    types: [ published ]

jobs:
  build:
    name: Check + source package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential zip

      - name: Install Python tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true

      - name: Toolchain check (expected: no full devkit on CI yet)
        run: |
          make check
          make info
          make help

      - name: Verify make firm refuses fake output
        run: |
          # Must fail without real toolchain – no corrupt .firm
          if make firm; then
            echo "ERROR: make firm should fail without toolchain"
            exit 1
          fi
          echo "OK: make firm correctly refused fake FIRM"

      - name: Source release package
        run: |
          make release
          test ! -f release/Omni10-3DS/Omni10.firm
          cd release && zip -r Omni10-3DS-source.zip Omni10-3DS

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Omni10-3DS-source-${{ github.sha }}
          path: release/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: release/Omni10-3DS-source.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
