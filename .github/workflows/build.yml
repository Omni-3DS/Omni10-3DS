name: Build Omni10

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        run: |
          V=$(tr -d ' \t\r\n' < version.dat)
          echo "version=$V" >> "$GITHUB_OUTPUT"

  firm:
    needs: version
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITARM: /opt/devkitpro/devkitARM
      PATH: /opt/devkitpro/devkitARM/bin:/opt/devkitpro/tools/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - uses: actions/checkout@v4
      - name: Install firmtool
        run: |
          apt-get update
          apt-get install -y python3-pip
          python3 -m pip install --break-system-packages git+https://github.com/TuxSH/firmtool.git
      - name: Build Omni10.firm
        run: make firm
      - name: Upload firm
        uses: actions/upload-artifact@v4
        with:
          name: Omni10.firm
          path: Omni10.firm

  installer:
    needs: version
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITARM: /opt/devkitpro/devkitARM
      PATH: /opt/devkitpro/devkitARM/bin:/opt/devkitpro/tools/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - uses: actions/checkout@v4
      - name: Generate assets
        run: python3 scripts/gen_assets.py
      - name: Build O10-Inst-Booter.3dsx
        run: make -C installer all
      - name: Upload 3dsx
        uses: actions/upload-artifact@v4
        with:
          name: O10-Inst-Booter.3dsx
          path: installer/O10-Inst-Booter.3dsx

  cia:
    needs: [version, installer]
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITARM: /opt/devkitpro/devkitARM
      PATH: /opt/devkitpro/devkitARM/bin:/opt/devkitpro/tools/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - uses: actions/checkout@v4
      - name: Generate assets
        run: python3 scripts/gen_assets.py
      - name: Build 3dsx
        run: make -C installer all
      - name: Build CIA
        run: |
          if command -v bannertool >/dev/null 2>&1 && command -v makerom >/dev/null 2>&1; then
            make -f installer/Makefile.cia cia
          else
            echo "bannertool/makerom missing — skip CIA"
            exit 0
          fi
      - name: Upload CIA
        if: hashFiles('installer/O10-Inst-Booter.cia') != ''
        uses: actions/upload-artifact@v4
        with:
          name: O10-Inst-Booter.cia
          path: installer/O10-Inst-Booter.cia
