version: 2

updates:
  # Python / Build-Hilfswerkzeuge
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5

    groups:
      python-dependencies:
        patterns:
          - "*"

    cooldown:
      default-days: 5
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3

    labels:
      - "dependencies"
      - "python"

    commit-message:
      prefix: "deps"

  # GitHub Actions / CI
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5

    groups:
      github-actions:
        patterns:
          - "*"

    cooldown:
      default-days: 5
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3

    labels:
      - "dependencies"
      - "ci"

    commit-message:
      prefix: "ci"
